server.port=8080

# Application Name
spring.application.name=food-rescue-backend

# H2 Database configuration (Default profile for zero-config instant startup)
spring.datasource.url=jdbc:h2:mem:foodrescuedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Dev only — disabled in production profile)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JWT Configuration (Override via environment variable JWT_SECRET in production!)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Scheduler Configuration (Runs every 60 seconds to auto-expire past donations)
app.scheduler.expiry-cron=0 * * * * *

# CORS Allowed Origins (override in production via env var CORS_ORIGINS)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Server Error Settings (hide internal details from API responses)
server.error.include-stacktrace=never
server.error.include-message=never
