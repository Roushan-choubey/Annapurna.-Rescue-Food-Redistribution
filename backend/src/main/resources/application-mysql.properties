# MySQL Database Configuration Profile
# Run with: java -jar -Dspring.profiles.active=mysql food-rescue-backend.jar
# or --spring.profiles.active=mysql

spring.datasource.url=jdbc:mysql://localhost:3306/food_rescue_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console disabled on MySQL profile
spring.h2.console.enabled=false
