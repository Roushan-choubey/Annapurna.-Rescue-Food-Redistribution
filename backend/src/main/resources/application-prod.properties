# Production Profile Configuration
# Activate with: java -jar food-rescue-backend.jar --spring.profiles.active=prod
# Or set environment variable: SPRING_PROFILES_ACTIVE=prod

# ──────────────────────────────────────────────────
# Database: MySQL (required env vars: MYSQL_URL, MYSQL_USER, MYSQL_PASSWORD)
# ──────────────────────────────────────────────────
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/food_rescue_db?createDatabaseIfNotExist=true&useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ──────────────────────────────────────────────────
# Security: H2 Console DISABLED
# ──────────────────────────────────────────────────
spring.h2.console.enabled=false

# ──────────────────────────────────────────────────
# JWT: Must be set via environment variable (no fallback!)
# ──────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ──────────────────────────────────────────────────
# CORS: Restrict to your production domain
# ──────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:https://yourdomain.com}

# ──────────────────────────────────────────────────
# Logging: Reduce verbosity for production
# ──────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.foodrescue=INFO
logging.level.org.springframework.security=WARN

# ──────────────────────────────────────────────────
# Server: Production settings
# ──────────────────────────────────────────────────
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
